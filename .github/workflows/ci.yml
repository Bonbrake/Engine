name: CI

on:
  push:
    branches: [ 'spec/*', 'main' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          architecture: x64
          toolset: 14.44

      - name: Setup Ninja + CMake
        uses: lukka/get-cmake@v3
        with:
          cmakeVersion: '3.27.x'
          ninjaVersion: '1.11.x'

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:/vcpkg
          C:/vcpkg/bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        shell: bash
        run: cmake -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        shell: bash
        run: cmake --build build --parallel 4

      - name: Run tests
        shell: bash
        run: |
          cd '${{ github.workspace }}/build'
          ./ZombieEngineTests.exe

      - name: Headless smoke
        shell: bash
        run: |
          cd '${{ github.workspace }}'
          ./build/ZombieEngine.exe --headless --quit-frame 1

      - name: Run clang-tidy
        shell: bash
        run: |
          choco install llvm -y
          export PATH="/c/Program Files/LLVM/bin:$PATH"
          clang-tidy --version
          cd '${{ github.workspace }}'
          cmake -B build-tidy -G Ninja -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build-tidy --parallel 4
          cd '${{ github.workspace }}'
          find src include tests -name '*.cpp' -o -name '*.h' | sort -u > /tmp/clang_tidy_files.txt
          while IFS= read -r f; do
            clang-tidy "$f" -p build-tidy --warnings-as-errors='*' || exit 1
          done < /tmp/clang_tidy_files.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binaries
          path: |
            build/ZombieEngine.exe
            build/ZombieEngineTests.exe
          retention-days: 7
